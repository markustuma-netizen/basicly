"approval_policy" = "on-request"
"approvals_reviewer" = "auto_review"
"default_permissions" = "basicly-workspace"

["permissions"."basicly-workspace"]
"extends" = ":workspace"

["permissions"."basicly-workspace"."filesystem"]
"glob_scan_max_depth" = 16

["permissions"."basicly-workspace"."filesystem".":workspace_roots"]
".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"


".git" = "write"
["permissions"."basicly-workspace"."network"]
"enabled" = true
"allow_local_binding" = true
"allow_upstream_proxy" = false

["permissions"."basicly-workspace"."network"."domains"]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"


"github.com" = "allow"

"api.github.com" = "allow"
["permissions"."basicly-workspace"."workspace_roots"]
"../basicly.worktrees" = true

["features"]
"network_proxy" = true
