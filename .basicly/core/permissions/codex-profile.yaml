approval_policy: on-request
approvals_reviewer: auto_review
default_permissions: basicly-workspace
permissions:
  basicly-workspace:
    extends: ":workspace"
    filesystem:
      glob_scan_max_depth: 16
      ":workspace_roots":
        ".git": write
        ".env": deny
        ".env.*": deny
        "**/.env": deny
        "**/.env.*": deny
  basicly-read-only:
    extends: ":read-only"
    filesystem:
      glob_scan_max_depth: 16
      ":workspace_roots":
        ".env": deny
        ".env.*": deny
        "**/.env": deny
        "**/.env.*": deny
    network:
      enabled: false
