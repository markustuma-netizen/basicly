<!doctype html><html><head><style>
 body { margin:0; font:14px/1.2 system-ui, sans-serif; color:#222 }
 /* The wall's card header in miniature: a title that clips with an ellipsis beside a label
    that keeps its width. The link inside the title is wider than the title, but the part
    past the title's edge is never painted, so it is not drawn over the label. */
 .title       { display:flex; gap:12px; width:300px }
 .title-text  { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
 .phase-name  { flex:none; font-weight:700 }
</style></head><body>
 <div class="title">
  <div class="title-text">
   <a href="#">Ship the Codex consent floor and preserve it during dispatch everywhere</a>
  </div>
  <div class="phase-name">WAITS TO LAND</div>
 </div>
</body></html>
